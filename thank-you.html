<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent | Nandhan Varma</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var stored = localStorage.getItem("color-theme");
        var isDark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body
    class="bg-light-bg dark:bg-dark-bg font-sans transition-colors duration-300 min-h-screen flex items-center justify-center px-4"
  >
    <main class="max-w-md text-center">
      <p
        class="font-mono text-sm tracking-widest text-primary-600 dark:text-primary-400 uppercase mb-4"
      >
        Message sent
      </p>
      <h1
        class="text-3xl md:text-4xl font-bold font-display text-light-heading dark:text-dark-heading mb-4"
      >
        Thanks for reaching out.
      </h1>
      <p class="text-lg text-light-text dark:text-dark-text mb-8">
        I've received your message and will get back to you as soon as I can.
      </p>
      <a
        href="/"
        class="inline-block bg-primary-600 text-white font-medium py-3 px-8 rounded-lg hover:bg-primary-700 transition-colors"
      >
        Back to portfolio
      </a>
    </main>
  </body>
</html>
